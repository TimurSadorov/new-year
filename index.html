<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c172c">
  <meta name="description" content="Новогодний адвент-календарь. Тридцать один день, гирлянда в зимнем лесу и сладкие сюрпризы.">
  <title>Твой сладкий декабрь</title>
  <link rel="icon" type="image/png" href="./assets/icon.png">
  <link rel="stylesheet" href="./style.css?v=2">
  <script type="module" src="./script.js?v=2"></script>
  <script src="./atmosphere.js" defer></script>
</head>
<body id="top">
  <div class="window-frost" id="window-frost" aria-hidden="true"></div>
  <canvas class="snowfall" id="snowfall" aria-hidden="true"></canvas>
  <audio id="winter-music" preload="none" loop></audio>

  <header class="topbar">
    <span class="edition" id="edition">Декабрь 2026</span>
    <div class="topbar__details">
      <span class="preview-badge" id="preview-badge" hidden>Демо</span>
      <button class="music-toggle" id="music-toggle" type="button" aria-label="Музыка" aria-pressed="false" title="Включить музыку" hidden>
        <span class="music-toggle__icon" aria-hidden="true">♫</span>
        <span class="music-toggle__label">Музыка</span>
      </button>
    </div>
  </header>

  <main>
    <div class="terrain" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <section class="intro" aria-labelledby="title">
      <h1 id="title">Твой сладкий <em>декабрь</em></h1>
      <p class="intro__status" id="calendar-status" aria-live="polite"></p>
      <a class="trail-link" id="trail-link" href="#trail">К календарю</a>
    </section>

    <section class="calendar" id="trail" aria-label="Дни декабря">
      <div class="track" id="track">
        <canvas class="track__scenery" id="scenery" aria-hidden="true"></canvas>
        <div class="track__lights" id="scenery-lights" aria-hidden="true"></div>
        <canvas class="track__cord" id="garland-cord" aria-hidden="true"></canvas>
        <ol class="track__days" id="days" aria-label="31 день декабря"></ol>
      </div>
      <noscript>Включи JavaScript, чтобы открывать подарки.</noscript>
    </section>
  </main>

  <dialog class="gift-dialog" id="gift-dialog" aria-labelledby="gift-title">
    <button class="close" id="dismiss" type="button" aria-label="Закрыть" autofocus>×</button>
    <div class="gift-dialog__art" id="gift-art">
      <img id="gift-image" width="512" height="512" alt="">
      <div class="gift-wrap" aria-hidden="true">
        <div class="present">
          <span class="present__box"></span>
          <span class="present__lid"></span>
        </div>
      </div>
      <canvas class="gift-fireworks" id="gift-fireworks" aria-hidden="true"></canvas>
    </div>
    <div class="gift-dialog__content">
      <p class="gift-dialog__date" id="gift-date"></p>
      <h2 id="gift-title"></h2>
      <p id="gift-message" hidden></p>
    </div>
  </dialog>
</body>
</html>
